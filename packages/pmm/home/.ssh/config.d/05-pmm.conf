# pmm: `ssh <machine>` for running machines. The Host entries are pmm's STATE, rewritten by
# `pmm up` and `pmm down` ($PMM_STATE_HOME/ssh_config); this file only includes them, so nothing
# pmm runs writes into ~/.ssh. Read where ~/.ssh/config includes config.d/*.conf (stack/ssh).
# Sorts ahead of a person's own fragments: ssh takes the first value it reads for a setting.
# A missing file is no error (before the first `pmm up`). With XDG_STATE_HOME moved elsewhere,
# set PMM_SSH_CONFIG to this path or claim this file (ppm file claim) and point it there.
Include ~/.local/state/pmm/ssh_config
