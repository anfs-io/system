version: 0.1.5
author: rjayroach
depends:
  - qemu
# tart runs macOS guests (the tart backend); it is in OpenAI's tap, which ppm trusts because it is
# declared here. Linux has no tart: tart images and the machines from them are macOS-only.
brew:
  macos: [openai/tools/tart]
links: [.local/lib/pmm/]
