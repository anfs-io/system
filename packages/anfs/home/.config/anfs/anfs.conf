# anfs configuration — shipped by the anfs package; every anfs tool reads it.
#
# Override any of it in ~/.config/anfs/anfs.local.conf (this machine only) or in your own repo's
# anfs package (a layer of this one: user/anfs). The environment wins over both, so
# `PCM_HEALTH_TIMEOUT=300 pcm up x` does what it says.
#
# Format: NAME=value, one per line; a value may be quoted. Each variable is named for the tool
# that reads it (ANFS_ for what every tool shares).

# --- sources (anfs) ---
# Seconds between automatic updates of the source repos (ppm install, pcm up, anfs install)
ANFS_UPDATE_CACHE_DURATION=86400
# Report sources not updated because of local changes only with --debug
#ANFS_QUIET_SKIPPED_REPOS=true

# --- Homebrew (ppm) ---
HOMEBREW_NO_AUTO_UPDATE=1
HOMEBREW_NO_ENV_HINTS=1
# Seconds between brew formula updates
HOMEBREW_UPDATE_CACHE_DURATION=86400

# --- pcm ---
# Compose runner: "podman compose" or "podman-compose"
#PCM_COMPOSE="podman compose"
# Seconds pcm up waits for a dependency to become healthy
#PCM_HEALTH_TIMEOUT=120
# The podman network services share, and the services always attached to it (space-separated,
# name or source/name). A service with pcm dependencies is attached regardless.
#PCM_SHARED_NETWORK=dev-net
#PCM_ATTACHED_SERVICES="postgres valkey"
# macOS: memory (MiB) of the podman machine VM. pcm up resizes a machine with another amount,
# restarting it (which stops every container in it). Unset leaves the machine as podman made it.
#PCM_MACHINE_MEMORY=4096
# The proxy routing x-pcm.ingress hosts (when several definitions provide one), and the domain
# a service's default host is under (<name>.<domain>)
#PCM_PROXY=traefik
#PCM_INGRESS_DOMAIN=localhost

# --- pim ---
# What `pim install` (and so `anfs install`) does with an image: build, or only validate
#PIM_INSTALL=build
# First localhost port pim forwards a VM's ssh to
#PIM_SSH_PORT_BASE=2222
# Seconds an unattended OS install may take, and seconds to wait for a booted VM's ssh
#PIM_INSTALL_TIMEOUT=3600
#PIM_SSH_TIMEOUT=600

# --- psm ---
# Version of the skills CLI psm runs through npx
#PSM_CLI_VERSION=latest

# --- wsm ---
# Where `wsm install` puts a source's workspaces (<dir>/<source>/<ws>/<space>) when not given a DIR; ~ is expanded
#WSM_SPACES_HOME=~/spaces
