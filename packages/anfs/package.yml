version: 0.2.9
author: rjayroach
# core/anfs is the anfs command and the libraries every tool shares. It depends on what the anfs
# command itself runs and nothing else: ppm, for `anfs src install` and the stacks. The toolkit
# (every tool and the software they run on) is the stack core/system (stacks/system/stack.yml),
# which install.sh installs with `anfs install system` and `anfs implode` removes. The tools don't
# declare a dependency back on anfs: like stow and yq it is base software, always present.
depends: [ppm]
