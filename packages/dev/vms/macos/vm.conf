# ppm test VM: a fresh macOS machine with two users.
#
# The vanilla image is deliberate: it has no Homebrew and no Xcode Command Line Tools, so a run
# against it exercises all of install.sh. (The -base images ship both and would skip the part
# most worth testing.) Homebrew's installer pulls the CLT headless via softwareupdate; bare
# `git` or `xcode-select --install` cannot, as they need a GUI session.
VM_IMAGE=ghcr.io/cirruslabs/macos-tahoe-vanilla:latest

# The image's own credentials, used once to install the harness key
VM_ADMIN_USER=admin
VM_ADMIN_PASSWORD=admin

VM_CPU=4
VM_MEMORY=8192
