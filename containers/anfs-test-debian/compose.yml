# anfs-test-debian — a fresh debian box for testing anfs installs: two users (owner, with sudo and the
# password 'owner'; other, without), every anfs source mounted read-only at /src/<alias>.
#
# pcm service: `pcm up anfs-test-debian`, then `ppm container install debian` (core/dev) or
# `pcm shell anfs-test-debian -u owner`. `pcm snapshot` / `pcm reset` keep a box at a point (say,
# Homebrew installed) and go back to it. The same Containerfile builds the standalone round-trip
# harness's box (packages/anfs/tests/harness).

x-pcm:
  privileges:
    privileged: "rootless podman runs inside the box, so pcm's own services can be tested in it"
    devices: "/dev/fuse, which podman's overlay storage inside the box needs"
  mounts:
    - set: anfs-sources
      target: /src

services:
  box:
    build: .
    image: localhost/anfs-test-debian
    hostname: debian
    command: ["sleep", "infinity"]
    privileged: true
    devices: ["/dev/fuse"]
