AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "public/vendor/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "app.rb"

# Views are HTML and the kinds table is data; their length reads better whole.
Metrics/MethodLength:
  Exclude:
    - "views/**/*"
    - "spec/**/*"

Metrics/AbcSize:
  Exclude:
    - "views/**/*"
    - "spec/**/*"

Metrics/ModuleLength:
  Exclude:
    - "lib/anfs/kinds.rb"

# Phlex components take their own arguments; Phlex::HTML#initialize takes none.
Lint/MissingSuper:
  Exclude:
    - "views/**/*"
