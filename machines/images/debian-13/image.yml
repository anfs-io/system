# Debian 13 (trixie) from the netinst ISO. Everything the build reads is in this directory:
# preseed.cfg (rendered with vars: below), provision/, test.sh. `pmm image show debian-13` lists it.
version: 0.1.0
description: Debian 13 base image
distro: debian
arch: [arm64, amd64]
# ids in the ISO catalogue (isos/isos.yml; `pmm iso list`), which pins each one's sha256
iso:
  arm64: debian-13-arm64
  amd64: debian-13-amd64
# what preseed.cfg's ${VAR}s are replaced with. pmm adds USER, FULLNAME, PASSWORD_HASH,
# SSH_PUBKEY, IMAGE and ARCH; a name the file uses that is in neither fails the build
vars:
  HOSTNAME: debian
  DOMAIN: local
  LOCALE: en_US.UTF-8
  KEYBOARD: us
  TIMEZONE: UTC
  MIRROR_HOST: deb.debian.org
  MIRROR_PATH: /debian
  HTTP_PROXY: ""
  PARTITIONING_METHOD: regular
  PARTITIONING_RECIPE: atomic
  TASKSEL: standard, ssh-server
  PACKAGES: openssh-server curl sudo qemu-guest-agent
  GRUB_DEVICE: default
