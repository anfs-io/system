# Fedora 44 Server from the netinst ISO. Everything the build reads is in this directory:
# kickstart.ks (rendered with vars: below), provision/, test.sh. `pmm image show fedora-44` lists it.
version: 0.1.0
description: Fedora 44 base image
distro: fedora
arch: [arm64, amd64]
# ids in the ISO catalogue (isos/isos.yml; `pmm iso list`), which pins each one's sha256
iso:
  arm64: fedora-44-arm64
  amd64: fedora-44-amd64
# what the build runs with: Anaconda needs more than pmm's 2048 MB
build:
  memory: 4096
timeouts:
  install: 3600
# what kickstart.ks's ${VAR}s are replaced with. pmm adds USER, FULLNAME, KS_PASSWORD,
# SSH_PUBKEY, IMAGE and ARCH; a name the file uses that is in neither fails the build
vars:
  HOSTNAME: fedora
  LOCALE: en_US.UTF-8
  KEYBOARD: us
  TIMEZONE: UTC
