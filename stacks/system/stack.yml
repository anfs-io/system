version: 0.1.1
description: The anfs toolkit itself, what install.sh installs and anfs implode removes
# The tools and the software they run on: pcm brings podman and varlock, psm node.
# Not pmm, pmm-network or qemu: those are `ppm install core/pmm` (or a stack that names them).
packages: [core/anfs, core/ppm, core/pcm, core/psm, core/wsm, core/podman, core/node, core/varlock]
# The dashboard, started on install: it reaches the tools through the toolkit API (its container.yml
# says toolkit: write; core/anfs's post_install loads the listener).
containers:
  - core/ui: { status: running }
